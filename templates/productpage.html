<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .tire.TireTitle }} — ЮРДИС</title>
  <link rel="stylesheet" href="/static/styles/styles.css">
  <style>
    .vibes-page { min-height: 100vh; background: #f6f7f7; }
    .vibes-viewport {
      position: relative; width: 100%; max-width: 420px;
      min-height: calc(100vh - 90px); margin: 0 auto; overflow: hidden;
    }
    .vibes-video {
      position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
      width: auto; height: auto; transform: translate(-50%, -50%);
      object-fit: cover; background: #000;
    }
    .vibes-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 40%, transparent 70%);
      pointer-events: none;
    }
    .vibes-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 24px 20px 32px; z-index: 5;
    }
    .vibes-title {
      font-size: 1.25rem; font-weight: 700; color: #fff;
      margin-bottom: 8px; text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .vibes-description {
      position: relative; max-height: 4.4rem; overflow: hidden;
      transition: max-height 0.3s ease; font-size: 0.9rem;
      color: rgba(255,255,255,0.85); line-height: 1.4; margin-bottom: 12px;
    }
    .vibes-description.expanded { max-height: 500px; }
    .read-more {
      color: #ed1c24; cursor: pointer; font-weight: 500;
      display: inline-block; margin-top: 4px; font-size: 0.85rem;
    }
    .read-more:hover { color: #c7181e; text-decoration: underline; }
    .fade-overlay {
      position: absolute; bottom: 0; left: 0; right: 0; height: 2.2rem;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      pointer-events: none; opacity: 1; transition: opacity 0.3s ease;
    }
    .vibes-description.expanded ~ .fade-overlay { opacity: 0; }
    .vibes-manager {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
      padding: 10px 14px; background: rgba(197, 95, 77, 0.25);
      border-radius: 10px; border: 1px solid rgba(197, 95, 77, 0.5);
      margin-bottom: 10px;
    }
    .vibes-manager__label {
      font-size: 0.75rem; color: rgba(255,255,255,0.7);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .vibes-manager__name {
      font-size: 0.95rem; font-weight: 600; color: #fff;
    }
    .vibes-btn {
      width: 100%; padding: 12px; background: #ed1c24; color: white;
      border: none; border-radius: 6px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background 0.3s;
    }
    .vibes-btn:hover { background: #c7181e; }
  </style>
</head>
<body class="vibes-page">

<header class="header-center">
  <div class="header-inner" style="display: flex; justify-content: center;">
    <div class="logo">
      <!-- ✅ ИЗМЕНЕНО: / → /tires -->
      <a href="/tires">
        <img src="/static/img/YURDIS_logo.svg" alt="logo" style="height: 80px;" />
      </a>
    </div>
  </div>
</header>

<div class="vibes-viewport">

  {{ if .tire.Video }}
  <video class="vibes-video" autoplay muted loop playsinline>
    <source src="{{ .minioBase }}/{{ .tire.Video }}" type="video/mp4">
  </video>
  <div class="vibes-overlay"></div>
  {{ else if .tire.Photo }}
  <img class="vibes-video" src="{{ .minioBase }}/{{ .tire.Photo }}" alt="{{ .tire.TireTitle }}">
  <div class="vibes-overlay"></div>
  {{ end }}

  <div class="vibes-content">
    <h1 class="vibes-title">{{ .tire.TireTitle }}</h1>
    <p class="vibes-description" id="desc-{{ .tire.TireID }}">{{ .tire.Description }}</p>
    <div class="fade-overlay" id="fade-{{ .tire.TireID }}"></div>
    <div class="vibes-manager">
      <span class="vibes-manager__label">Материал</span>
      <span class="vibes-manager__name">{{ .tire.TireMaterialCoefficient }}</span>
      <span style="color:rgba(255,255,255,0.5);">|</span>
      <span class="vibes-manager__label">Толщина</span>
      <span class="vibes-manager__name">{{ .tire.TireThicknessCoefficient }}</span>
    </div>
      </div>
</div>

<script>
  function toggleDesc(id) {
    const desc = document.getElementById('desc-' + id);
    desc.classList.toggle('expanded');
  }
  async function addToCart(tireId) {
    const r = await fetch(`/api/tire-pressure-entries/add/${tireId}`, {
      method: 'POST',
      headers: { 'Accept': 'application/json' }
    });
    if (r.ok) {
      const cart = await fetch('/api/tire-pressures/cart');
      const data = await cart.json();
      if (data.tire_pressure_id) window.location = `/tire-pressure/${data.tire_pressure_id}`;
    }
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шины — ЮРДИС</title>
  <link rel="stylesheet" href="/static/styles/styles.css?v=20260318">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <!-- ✅ ИЗМЕНЕНО: / → /tires -->
      <a href="/tires">
        <img src="/static/img/YURDIS_logo.svg" alt="logo" style="height: 80px;" />
      </a>
    </div>
  </div>
</header>

<main class="main-content">

  <div class="header-controls">
    <div class="search-box">
      <!-- ✅ ИЗМЕНЕНО: action="/" → action="/tires" -->
      <form action="/tires" method="GET">
        <input type="text" name="query" placeholder="Найти шину" value="{{ .query }}" />
        <button type="submit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </form>
    </div>

    <div class="cart-badge {{ if eq .cartCount 0 }}cart-inactive{{ end }}" id="cart-badge">
      <a href="{{ if ne .cartCount 0 }}/tire-pressure/{{ .tirePressureID }}{{ else }}#{{ end }}">
        <img src="/static/img/cart_icon.png" class="cart-icon" alt="корзина" />
        <span class="cart-count" id="cart-count">{{ .cartCount }}</span>
      </a>
    </div>
  </div>

  <h2 class="section-title">Типы шин</h2>
  <div class="tires-grid">
    {{ range .tires }}
    <div class="tire-card">
      <div class="tire-left">
        {{ if .Photo }}
        <img src="{{ $.minioBase }}/{{ .Photo }}" alt="{{ .TireTitle }}" />
        {{ else }}
        <div style="width:100%;height:100%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#999;">Нет фото</div>
        {{ end }}
      </div>
      <div class="device-info">
        <span class="device-type">Шина</span>
        <h3 class="tire-title">
          <a href="/tire/{{ .TireID }}">{{ .TireTitle }}</a>
        </h3>
        <span class="device-size">М: {{ .TireMaterialCoefficient }} | Т: {{ .TireThicknessCoefficient }}</span>
        <p style="font-size:13px;color:#666;">{{ .Description }}</p>
        <button type="button" class="tire-btn" onclick="addToCart({{ .TireID }})">+ В расчёт</button>
      </div>
    </div>
    {{ end }}
  </div>

</main>

<script>
  async function addToCart(tireId) {
    try {
      const r = await fetch(`/api/tire-pressure-entries/add/${tireId}`, {
        method: 'POST',
        headers: { 'Accept': 'application/json' }
      });

      if (r.ok) {
        const cartR = await fetch('/api/tire-pressures/cart');
        const cartData = await cartR.json();

        const cartBadge = document.getElementById('cart-badge');
        const cartCount = document.getElementById('cart-count');
        const cartLink = cartBadge.querySelector('a');

        if (cartData.tires_count > 0) {
          cartCount.textContent = cartData.tires_count;
          cartLink.href = `/tire-pressure/${cartData.tire_pressure_id}`;
          cartBadge.classList.remove('cart-inactive');
        }
      }
    } catch (e) {
      console.error('Ошибка сети:', e);
    }
  }
</script>

</body>
</html>

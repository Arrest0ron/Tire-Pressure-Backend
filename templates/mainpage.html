<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шины — ЮРДИС</title>
  <link rel="stylesheet" href="/static/styles/styles.css?v=20260318">
</head>
<body>

<!-- ✅ HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <a href="/">
        <img src="/static/img/YURDIS_logo.svg" alt="logo" style="height: 40px;" />
      </a>
    </div>
  </div>
</header>

<!-- ✅ MAIN CONTENT -->
<main class="main-content">

  <!-- ✅ SEARCH + CART -->
  <div class="header-controls">
    <div class="search-box">
      <form action="/" method="GET">
        <input type="text" name="query" placeholder="Найти шину" value="{{ .query }}" />
        <button type="submit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </form>
    </div>

    <!-- ✅ CART BADGE (ваша оригинальная иконка) -->
    <div class="cart-badge {{ if eq .cartCount 0 }}cart-inactive{{ end }}">
      {{ if ne .cartCount 0 }}
      <a href="/tire-pressure/{{ .tirePressureID }}">
        {{ end }}
        <img src="/static/img/cart_icon.png" class="cart-icon" alt="корзина" />
        <span class="cart-count">{{ .cartCount }}</span>
        {{ if ne .cartCount 0 }}
      </a>
      {{ end }}
    </div>
  </div>

  <!-- ✅ TIRES GRID -->
  <h2 class="section-title">Типы шин</h2>
  <div class="tires-grid">
    {{ range .tires }}
    <div class="tire-card">
      <div class="tire-left">
        {{ if .Photo }}
        <img src="{{ $.minioBase }}/{{ .Photo }}" alt="{{ .TireTitle }}" />
        {{ else }}
        <div style="width:100%;height:100%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#999;">Нет фото</div>
        {{ end }}
      </div>
      <div class="device-info">
        <span class="device-type">Шина</span>
        <h3 class="tire-title">
          <a href="/tire/{{ .TireID }}">{{ .TireTitle }}</a>
        </h3>
        <span class="device-size">
          М: {{ .TireMaterialCoefficient }} | Т: {{ .TireThicknessCoefficient }}
        </span>
        <p style="font-size:13px;color:#666;">{{ .Description }}</p>
        <form action="/add-to-tire-pressure" method="POST" style="margin-top:10px;">
          <input type="hidden" name="tire_id" value="{{ .TireID }}">
          <button type="submit" class="tire-btn">+ В расчёт</button>
        </form>
      </div>
    </div>
    {{ end }}
  </div>

</main>
</body>
</html>

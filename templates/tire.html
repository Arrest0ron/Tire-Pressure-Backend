<html lang="ru">
<head>
    <title>{{ .tire.Title }} — Подробная информация</title>
    <link rel="stylesheet" href="/static/styles/index_style.css">
</head>

<body class="vibes-page">

<header class="header-center">
    <div class="header-inner" style="display: flex; justify-content: center;">
        <h1 class="logo">
            <a href="/tires">Домой</a>
        </h1>
    </div>
</header>

<div class="vibes-viewport">

    <video class="vibes-video" controls autoplay muted loop>
        <source src="http://localhost:9000/test/{{ .tire.Video }}" type="video/mp4">
    </video>

    <div class="vibes-overlay"></div>

    <div class="vibes-content">

        <h1 class="vibes-title">{{ .tire.Title }}</h1>

        <p class="vibes-meta">
            {{ .tire.Width }}/{{ .tire.Profile }} R{{ .tire.Diameter }} · {{ .tire.Type }}
        </p>

        <p class="vibes-description">
            {{ .tire.ServiceDescription }}
        </p>

        <div class="vibes-manager">
            <span class="vibes-manager__label">Коэффициент шины</span>
            <span class="vibes-manager__name">
                {{ .tire.TireCoefficient }} бар
            </span>
        </div>

        <form method="POST" action="/cart/add" style="margin-top:16px;">
            <input type="hidden" name="tire_id" value="{{ .tire.ID }}">
            <button type="submit" class="tire-btn" style="width: 100%; padding: 10px 0; background-color: #ed1c24; color: white; text-align: center; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 500; border: none; cursor: pointer; transition: background-color 0.3s ease;">
                Добавить в заявку
            </button>
        </form>

    </div>
</div>

</body>
</html>
